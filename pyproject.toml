[project]
name = "unlock-accessibility-graph"
version = "0.10.0"
description = "UNLOCK — The Accessibility Impact Graph (Relate by Neo4j Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "relate-db==1.0.2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mcp>=2.3,<3"]
agent = ["mcp>=2.3,<3"]

[project.scripts]
unlock = "unlock.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
